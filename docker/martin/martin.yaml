# Martin tile server configuration.
# Publish only the curated `sara` schema (POI/tile views) to keep the catalog clean.
postgres:
  connection_string: ${DATABASE_URL:-postgresql://sara:sara@postgis:5432/sara}
  default_srid: 4326
  auto_bounds: quick
  auto_publish:
    tables:
      from_schemas:
        - sara
      # Publish as bare table names (tile_points, tile_roads, tile_areas) so the
      # gateway allowlist and frontend tile URLs can stay schema-free.
      source_id_format: "{table}"
      id_columns:
        - osm_id
      clip_geom: true
      buffer: 64
      extent: 4096
    functions:
      from_schemas: []
cache:
  size_mb: 512
